# Префикс: Alt+Space (в GNOME отключён activate-window-menu, который занимал эту комбинацию)
set -g prefix M-Space
unbind C-b
bind M-Space send-prefix

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Нумерация с 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Мышь
set -g mouse on

# Деление окна: новая панель открывается в текущей директории
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Переход между панелями в стиле vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Перезагрузка конфига
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Copy mode в стиле vi
setw -g mode-keys vi

# Дубли привязок для русской раскладки (та же физическая клавиша)
bind с new-window                                                # c
bind т next-window                                               # n
bind з previous-window                                           # p
bind ц choose-tree -Zw                                           # w
bind б command-prompt -I "#W" { rename-window "%%" }             # ,
bind ю command-prompt -T target { move-window -t "%%" }          # .
bind ? confirm-before -p "kill-window #W? (y/n)" kill-window     # & (Shift+7 на русской раскладке)
bind к source-file ~/.tmux.conf \; display "Reloaded"            # r
bind -r р select-pane -L                                         # h
bind -r о select-pane -D                                         # j
bind -r л select-pane -U                                         # k
bind -r д select-pane -R                                         # l

# Плагины
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Тема catppuccin
set -g @catppuccin_flavor 'mocha'

run '~/.tmux/plugins/tpm/tpm'
